name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      repeat:
        description: "Execucoes consecutivas de pytest (M152 homologacao)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

jobs:
  lint-and-test-linux:
    runs-on: ubuntu-latest
    env:
      DEFAULT_ADMIN_PASSWORD: test-only-admin-password
      AUTH_REQUIRED: "true"
      META_DRY_RUN: "true"
      META_AUTOPUBLISH: "false"
      META_ALLOW_ACTIVE_LAUNCH: "false"
      META_ALLOW_PRODUCTION_REAL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libmagic1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Lint Python syntax
        run: python -m compileall -q src

      - name: Run pytest suite (repeat ${{ inputs.repeat || '1' }}x)
        env:
          PYTEST_REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          for i in $(seq 1 "${PYTEST_REPEAT}"); do
            echo "=== pytest run ${i}/${PYTEST_REPEAT} (linux) ==="
            pytest -q || exit 1
          done

  lint-and-test-windows:
    runs-on: windows-latest
    env:
      DEFAULT_ADMIN_PASSWORD: test-only-admin-password
      AUTH_REQUIRED: "true"
      META_DRY_RUN: "true"
      META_AUTOPUBLISH: "false"
      META_ALLOW_ACTIVE_LAUNCH: "false"
      META_ALLOW_PRODUCTION_REAL: "false"
      CI_SKIP_FFMPEG: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Lint Python syntax
        run: python -m compileall -q src

      - name: Run pytest suite (ffmpeg tests skipped on Windows CI, repeat ${{ inputs.repeat || '1' }}x)
        env:
          PYTEST_REPEAT: ${{ inputs.repeat || '1' }}
        shell: bash
        run: |
          for i in $(seq 1 "${PYTEST_REPEAT}"); do
            echo "=== pytest run ${i}/${PYTEST_REPEAT} (windows) ==="
            pytest -q -m "not ffmpeg" || exit 1
          done
